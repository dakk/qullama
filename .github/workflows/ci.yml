name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build patched llama.cpp (CPU)
        run: JOBS=4 ./build_patched_llama.sh

      - name: Run tests
        run: python tests/test_qgate.py

      - name: Upload patched binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-embedding-linux-x86_64
          path: |
            llama.cpp/build/bin/llama-embedding
            llama.cpp/build/bin/lib*.so*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t qullama .

      - name: Smoke test (bell.qasm inside the container)
        run: docker run --rm qullama eval examples/bell.qasm
