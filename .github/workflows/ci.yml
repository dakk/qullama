name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Build patched llama.cpp (CPU)
        run: JOBS=4 ./build_patched_llama.sh

      - name: Run tests
        run: python tests/test_qgate.py
