name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write 

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python deps
        run: pip install -e .

      - name: Build patched llama.cpp (CPU)
        run: JOBS=4 ./build_patched_llama.sh

      - name: Pack the binary + ggml libs
        run: tar -czf llama-embedding-linux-x86_64.tar.gz -C llama.cpp/build/bin .

      - uses: softprops/action-gh-release@v2
        with:
          files: llama-embedding-linux-x86_64.tar.gz

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
